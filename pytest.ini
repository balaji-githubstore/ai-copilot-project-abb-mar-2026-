[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output configuration
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --html=reports/report.html
    --self-contained-html
    --metadata browser chrome
    --metadata environment dev

# Test markers for organization
markers =
    smoke: Smoke tests - critical functionality
    regression: Regression tests - full test suite
    critical: Critical path tests - must pass
    slow: Slow running tests - may require longer timeout
    api: API integration tests
    ui: User interface tests
    login: Login and authentication tests
    checkout: E-commerce checkout flow tests

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test execution configuration
minversion = 6.0
required_plugins = pytest-html pytest-xdist pytest-rerunfailures

# Filtering and collection
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Parallel execution settings
# Use with: pytest -n auto
# or: pytest -n 4